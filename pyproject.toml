[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "perfect-limiter"
version = "0.1.0"
description = "Python bindings for a look-ahead brick-wall audio limiter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.23"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Rust",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
bindings = "pyo3"
features = ["python"]
module-name = "perfect_limiter"
