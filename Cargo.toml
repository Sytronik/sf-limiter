[package]
name = "sf-limiter"
version = "0.2.0"

authors = ["Sytronik <sytronik210@gmail.com>"]
categories = ["multimedia::audio"]
description = "A look-ahead brick-wall audio limiter"
edition = "2024"
keywords = ["audio", "dsp", "limiter"]
license = "MIT"
readme = "README-rust.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["simd"]
simd = ["dep:pulp"]
python = ["dep:numpy", "dep:pyo3"]

[dependencies]
pulp = {version = "0.22.3", optional = true, default-features = false, features = ["std", "x86-v3"]}
numpy = {version = "0.29.0", optional = true}
pyo3 = {version = "0.29.0", features = ["abi3-py311"], optional = true}

[dev-dependencies]
approx = "0.5"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"
