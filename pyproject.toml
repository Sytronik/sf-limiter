[project]
name = "sf-limiter"
version = "0.1.0"

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Rust",
  "Typing :: Typed",
]
description = "Python bindings for a look-ahead brick-wall audio limiter"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"

dependencies = ["numpy>=1.23"]

[dependency-groups]
benchmark = [
  "numpy-audio-limiter==0.2.0",
]
dev = [
  "pyrefly==1.2.0",
  "pytest>=8",
  "ruff~=0.16.1",
]

[build-system]
build-backend = "maturin"
requires = ["maturin>=1.9,<2"]

[tool.maturin]
bindings = "pyo3"
features = ["python"]
module-name = "sf_limiter"
